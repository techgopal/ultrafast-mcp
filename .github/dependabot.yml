version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - examples/01-basic-echo
      - examples/02-file-operations
      - examples/03-everything-server
      - examples/04-authentication-example
      - tests/integration-test-suite
    schedule:
      interval: weekly
    cooldown: # applies only to version-updates (security-updates will be suggested immediately)
      default-days: 10
      semver-minor-days: 14 # wait 14 days before applying minor updates
      semver-major-days: 28
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
